name: test scenario 11 (jenkins-deploy-to-k8s)
on:
  workflow_dispatch:
  push:
    paths: ['devops-badge/jenkins-deploy-to-k8s/**', 'tests/jenkins-deploy-to-k8s/**', '.github/workflows/test-jenkins-deploy-to-k8s.yml']
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh (as Killercoda runs it)
        run: |
          start=$(date +%s)
          sudo bash devops-badge/jenkins-deploy-to-k8s/setup.sh || true
          echo "setup took $(( $(date +%s) - start ))s"
          sudo tail -60 /var/log/badge-setup.log
          test -f /tmp/setup-done
      - name: check before solving must NOT pass
        run: sudo /usr/local/bin/check | tee /tmp/c0; grep -q 'NOT YET' /tmp/c0
      - name: reference solution
        run: |
          start=$(date +%s)
          sudo bash tests/jenkins-deploy-to-k8s/solve.sh
          echo "solve took $(( $(date +%s) - start ))s"
      - name: check after solving must pass
        run: sudo /usr/local/bin/check | tee /tmp/c1; grep -q 'PASS' /tmp/c1
      - name: resources
        if: always()
        run: free -m; sudo docker stats --no-stream; sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml -n prod get all || true
