name: test scenario 16 (website-monitoring)
on:
  workflow_dispatch:
  push:
    paths: ['devops-badge/website-monitoring/**', 'tests/website-monitoring/**', 'tests/browser/**', '.github/workflows/test-website-monitoring.yml']
jobs:
  course:
    name: course-faithful solution + browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: memory sampler
        run: (while :; do free -m | awk '/Mem:/{print $3}'; sleep 2; done > /tmp/mem) &
      - name: setup.sh (as Killercoda runs it)
        run: |
          start=$(date +%s)
          sudo bash devops-badge/website-monitoring/setup.sh || true
          echo "setup took $(( $(date +%s) - start ))s"
          sudo tail -60 /var/log/badge-setup.log
          test -f /tmp/setup-done
      - name: wait.sh reports ready
        run: timeout 30 bash devops-badge/website-monitoring/wait.sh | tee /tmp/w; grep -q 'Lab is ready' /tmp/w
      - name: check before solving must NOT pass
        run: sudo /usr/local/bin/check | tee /tmp/c0; grep -q 'NOT YET' /tmp/c0
      - name: browser - Mailpit inbox through the Killercoda-style proxy
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
          sudo bash tests/browser/proxy.sh 8025
          python tests/browser/ui.py mailpit 8025
      - name: course-faithful solution (monitor-website.py)
        run: |
          sudo bash tests/website-monitoring/solve-course.sh
          sudo cat /root/monitoring/monitor.py
      - name: check after course solution must pass
        run: |
          start=$(date +%s)
          sudo /usr/local/bin/check | tee /tmp/c2
          echo "check took $(( $(date +%s) - start ))s"
          grep -q 'PASS' /tmp/c2
      - name: browser - alert email visible in the inbox UI
        run: python tests/browser/ui.py mailpit-msg 8025 'SITE DOWN'
      - name: Ctrl-C during check restores the lab
        run: |
          sudo pkill -f 'monitor.py'
          sudo timeout -s INT 30 /usr/local/bin/check | tee /tmp/c3 || true
          grep -q 'Interrupted' /tmp/c3
          test "$(sudo docker inspect -f '{{.State.Status}}' nginx-app)" = running
          test "$(sudo docker inspect -f '{{.State.Status}}' web-server)" = running
          curl -sf -o /dev/null http://192.168.77.10:8080/
      - name: debug
        if: always()
        run: free -m; sudo docker stats --no-stream; sudo docker ps -a; sudo tail -60 /root/monitoring/monitor.log || true
      - name: peak RAM
        if: always()
        run: |
          peak=$(sort -n /tmp/mem | tail -1); echo "peak used RAM: ${peak} MB"
          test "$peak" -le 3500
  reference:
    name: reference solution + negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: memory sampler
        run: (while :; do free -m | awk '/Mem:/{print $3}'; sleep 2; done > /tmp/mem) &
      - name: setup.sh (as Killercoda runs it)
        run: |
          start=$(date +%s)
          sudo bash devops-badge/website-monitoring/setup.sh || true
          echo "setup took $(( $(date +%s) - start ))s"
          sudo tail -60 /var/log/badge-setup.log
          test -f /tmp/setup-done
      - name: check before solving must NOT pass
        run: sudo /usr/local/bin/check | tee /tmp/c0; grep -q 'NOT YET' /tmp/c0
      - name: grader catches a hardcoded API token
        run: |
          sudo bash -c '. /etc/badge-lab/secrets.env; mkdir -p /root/monitoring; echo "TOKEN = \"$LINODE_TOKEN\"" > /root/monitoring/monitor.py'
          sudo /usr/local/bin/check | tee /tmp/c1; grep -q 'literal LINODE_TOKEN' /tmp/c1
      - name: reference solution
        run: |
          start=$(date +%s)
          sudo bash tests/website-monitoring/solve.sh
          echo "solve took $(( $(date +%s) - start ))s"
      - name: check after solving must pass
        run: |
          start=$(date +%s)
          sudo /usr/local/bin/check | tee /tmp/c2
          echo "check took $(( $(date +%s) - start ))s"
          grep -q 'PASS' /tmp/c2
      - name: grader catches requests.get without a timeout (monitor hangs on a frozen server)
        run: |
          sudo sed -i 's/requests.get(URL, timeout=5)/requests.get(URL)/' /root/monitoring/monitor.py
          sudo systemctl restart website-monitor; sleep 3
          sudo /usr/local/bin/check | tee /tmp/c3; grep -q 'NOT YET: Stage 2' /tmp/c3; grep -q 'no timeout' /tmp/c3
      - name: check restored the lab after the failed stage
        run: curl -sf -o /dev/null http://192.168.77.10:8080/ && sudo docker ps
      - name: debug
        if: always()
        run: free -m; sudo docker stats --no-stream; sudo docker ps -a; sudo journalctl -u website-monitor --no-pager | tail -40 || true
      - name: peak RAM
        if: always()
        run: |
          peak=$(sort -n /tmp/mem | tail -1); echo "peak used RAM: ${peak} MB"
          test "$peak" -le 3500
